# ECHO — Gradle configuration
# Target host is a 15 GB RAM / limited-disk dev machine, so keep the daemon lean.

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Explicit JVM target keeps javac/kotlinc in sync without per-module boilerplate.
kotlin.jvm.target.validation.mode=error
